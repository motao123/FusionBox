name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check (shipped scripts)
        run: |
          set -e
          for f in fusion.sh install.sh src/init.sh src/lib/common.sh src/lib/deploy.sh src/modules/*.sh src/i18n/*.sh; do
            bash -n "$f"
          done
          python3 -m py_compile src/lib/*.py scripts/*.py
          python3 src/lib/market_apps.py catalog >/dev/null
          printf '[]\n' > /tmp/releases.json
          python3 scripts/release_downloads.py --fixture /tmp/releases.json --output /tmp/metrics.json --shields-output /tmp/shield.json
          echo "All shipped code checks passed"
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Regression checks (v1.35.0 UX fixes)
        run: |
          set -e
          bash tests/run_checks.sh
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Release version consistency
        run: |
          set -e
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fqx "export FUSION_VER=\"$version\"" src/init.sh
          grep -Fq "version-$version" README.md
          grep -Fq "v$version" docs/index.html
          grep -Fq "v$version" docs/implementation-status.md
          echo "version.txt / init.sh / README / Pages / 实施状态 版本一致: $version"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tag" == "v$version" ]]
          grep -Fqx "export FUSION_VER=\"$version\"" src/init.sh
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package complete distribution
        run: |
          git archive --format=tar.gz --prefix=FusionBox/ -o FusionBox-${{ steps.version.outputs.tag }}.tar.gz HEAD
          sha256sum FusionBox-${{ steps.version.outputs.tag }}.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FusionBox ${{ steps.version.outputs.tag }}
          body: |
            ## FusionBox ${{ steps.version.outputs.tag }}

            ### 安装方式
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/motao123/FusionBox/main/install.sh)
            ```

            ### 更新
            ```bash
            fusionbox update
            ```
          files: |
            fusion.sh
            install.sh
            version.txt
            FusionBox-*.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
