name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check (shipped scripts)
        run: |
          set -e
          for f in fusion.sh install.sh src/init.sh src/lib/common.sh src/lib/deploy.sh src/modules/*.sh src/i18n/*.sh; do
            bash -n "$f"
          done
          echo "All syntax checks passed"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package complete distribution
        run: |
          git archive --format=tar.gz --prefix=FusionBox/ -o FusionBox-${{ steps.version.outputs.tag }}.tar.gz HEAD
          sha256sum FusionBox-${{ steps.version.outputs.tag }}.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FusionBox ${{ steps.version.outputs.tag }}
          body: |
            ## FusionBox ${{ steps.version.outputs.tag }}

            ### 安装方式
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/motao123/FusionBox/main/install.sh)
            ```

            ### 更新
            ```bash
            fusionbox update
            ```
          files: |
            fusion.sh
            install.sh
            version.txt
            FusionBox-*.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
