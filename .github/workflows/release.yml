name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 语法与静态产物
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check (shipped scripts)
        run: |
          set -e
          for f in fusion.sh install.sh src/init.sh src/lib/common.sh src/lib/deploy.sh \
                   src/modules/*.sh src/i18n/*.sh; do
            bash -n "$f"
          done
          echo "所有 shell 脚本语法检查通过"

      - name: Python byte-compile and catalog generation
        run: |
          set -e
          python3 -m py_compile src/lib/*.py scripts/*.py
          python3 src/lib/market_apps.py catalog >/dev/null
          printf '[]\n' > /tmp/releases.json
          python3 scripts/release_downloads.py --fixture /tmp/releases.json \
            --output /tmp/metrics.json --shields-output /tmp/shield.json
          echo "Python 产物检查通过"
        env:
          PYTHONDONTWRITEBYTECODE: '1'


      - name: i18n audit (bilingual pack contract)
        run: |
          set -e
          python3 scripts/i18n_audit.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Release version consistency
        run: |
          set -e
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fqx "export FUSION_VER=\"$version\"" src/init.sh
          grep -Fq "version-$version" README.md
          grep -Fq "v$version" docs/index.html
          grep -Fq "v$version" docs/implementation-status.md
          echo "version.txt / init.sh / README / Pages / 实施状态 版本一致: $version"

  # ---------------------------------------------------------------- 打标签时发布
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [syntax]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tag" == "v$version" ]]
          grep -Fqx "export FUSION_VER=\"$version\"" src/init.sh
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # tests/ 不入库（.gitignore + .gitattributes 的 export-ignore），发布包不含测试资产。
      - name: Package complete distribution
        run: |
          git archive --format=tar.gz --prefix=FusionBox/ -o FusionBox-${{ steps.version.outputs.tag }}.tar.gz HEAD
          sha256sum FusionBox-${{ steps.version.outputs.tag }}.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FusionBox ${{ steps.version.outputs.tag }}
          body: |
            ## FusionBox ${{ steps.version.outputs.tag }}

            ### 安装方式
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/motao123/FusionBox/main/install.sh)
            ```

            ### 更新
            ```bash
            fusionbox update
            ```

            ### 模块帮助
            ```bash
            fusionbox help            # 总帮助
            fusionbox help system     # 模块详细帮助（等价于 fusionbox system help）
            ```

            完整变更历史见 [docs/CHANGELOG.md](https://github.com/motao123/FusionBox/blob/main/docs/CHANGELOG.md)。
          files: |
            fusion.sh
            install.sh
            version.txt
            FusionBox-*.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
