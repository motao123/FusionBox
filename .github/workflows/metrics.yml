name: GitHub release metrics

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate release download metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_downloads.py

      - name: Commit changed metrics
        run: |
          git add docs/generated/github-metrics.json docs/generated/github-downloads-shield.json
          if git diff --cached --quiet; then
            echo "Release metrics are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metrics): update GitHub release downloads [skip ci]"
          git push origin HEAD:main
