# FusionBox Configuration File
# Path: ~/.config/fusionbox/config.yaml
#
# 原则：本文件只声明 **会被 FusionBox 实际读取** 的键。
# 写入一个不会被读取的开关，会让用户以为“已经生效”，这是最伤信任的一类不一致；
# 因此未实现的设置项一律不在此列出，它们的真实归属见文件末尾「不由本文件控制的设置」。

# General settings
general:
  lang: auto                  # 输出语言: auto / zh_CN / en（auto 跟随 $LANG）
  stats: false                # 匿名使用统计（默认关闭，需显式 opt-in；fusionbox privacy）
  color: true                 # 彩色输出；false 时清空全部 ANSI 颜色（适合日志重定向）

# System module
system:
  monitor_interval: 5         # `fusionbox system monitor` 刷新间隔（秒，正整数）
  backup_dir: /root/backups   # `fusionbox system backup|restore` 默认目录（命令行参数可覆盖）

# Network tools
network:
  speedtest_server: auto      # 网速测试节点: auto（就近）或 speedtest 数值节点 ID

# 服务器面板
panels:
  # 宝塔渠道码：官方安装脚本会把它作为 o= 参数上报给 bt.cn 的安装统计接口，
  # 并写入 /www/server/panel/data/o.pl，用于装机归属识别；它不是登录凭据，也不授予
  # 对面板的访问权限。不想让装机计入某个渠道、或想换成自己的码，把这里改成自己的值
  # 或留空（留空即走宝塔默认流程，不带渠道码安装）。
  bt_install_code: rU2tN9mZ

# ---------------------------------------------------------------------------
# 不由本文件控制的设置（请勿在此写入同名键，写了也不会生效）：
#   * 自动更新        -> fusionbox update --cron on|off|status（受管 /etc/cron.d/fusionbox-update）
#   * 代理 bin/conf/log 目录 -> 由安装布局固定（/etc/fusionbox/proxy/...、/var/log/fusionbox-proxy），不支持重定位
#   * 网站根目录 / PHP 版本  -> 建站、装组件时逐项选择，不设全局默认
#   * Docker Compose 项目    -> 由 `fusionbox market managed` 注册表与项目自身管理
#   * 宝塔 / 1Panel / X-UI 端口 -> 各上游安装器自带默认值，FusionBox 不覆盖
# ---------------------------------------------------------------------------
