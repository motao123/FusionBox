# FusionBox Docker Compose Template
# Prometheus + Grafana monitoring stack
#
# 两个面板只绑 127.0.0.1，与本仓库托管应用层一致（src/lib/market_apps.py 把
# bridge 端口一律渲染成 127.0.0.1:已发布:目标）。要从外网看，请经反向代理/TLS
# 或 SSH 隧道转发，不要改成 0.0.0.0。
#
# Grafana 管理员口令必须由使用方提供：与本文件同目录建 .env 写入
#   GRAFANA_ADMIN_PASSWORD=<你的强口令>
# 缺失或为空时 docker compose 会在启动前直接报错，而不是回落到内置默认口令。

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?required - create .env next to this file and set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  prometheus_data:
  grafana_data:
