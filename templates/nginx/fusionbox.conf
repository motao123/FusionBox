# FusionBox Nginx Template
# Optimized Nginx configuration for proxy + web

# Main fusionbox nginx config - include this from nginx.conf
# Add to http block:
#   include /etc/nginx/fusionbox/*.conf;

# Gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# Security headers
# X-XSS-Protection 已废弃（现代浏览器不再实现，且会引入自己的问题），不要再下发。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS 只在 HTTPS 的 server 块里下发（本文件被 include 到 http 层，对明文站点无意义），
# 且一旦下发浏览器会在 max-age 内强制走 HTTPS——确认全站可用后再取消注释并按需缩短时长：
# add_header Strict-Transport-Security "max-age=31536000" always;
# CSP 同理不在 http 层统一给：站点种类未知，收紧策略会直接打断第三方脚本/样式，
# 需要按站在自己的 server/location 里写。

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=fusionbox:10m rate=10r/s;

# Cache zone
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=fusionbox_cache:10m max_size=1g inactive=60m use_temp_path=off;
